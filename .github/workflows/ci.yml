name: CI and publish

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scent-mood/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scent-mood/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scent-mood/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: scent-mood/backend/pom.xml
      - run: mvn -B -ntp test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-test-reports
          path: scent-mood/backend/target/surefire-reports/
          if-no-files-found: warn

  browser-test:
    needs: [frontend-lint, backend-test]
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.postgres.yml
    defaults:
      run:
        shell: bash
        working-directory: scent-mood
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scent-mood/e2e/package-lock.json
      - name: Validate catalog
        run: python etl/catalog.py
      - name: Build and start PostgreSQL stack
        run: docker compose up --build --wait
      - name: Install browser tests
        working-directory: scent-mood/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test application
        working-directory: scent-mood/e2e
        run: npm test
      - name: Verify unprivileged Nginx and API proxy
        run: |
          test "$(docker compose exec -T frontend cat /proc/1/comm)" = nginx
          master_uid=$(docker compose exec -T frontend awk '/^Uid:/{print $3}' /proc/1/status)
          printf 'Nginx master effective UID: %s\n' "$master_uid"
          test "$master_uid" -gt 0
          curl -fsS http://127.0.0.1:15173/ | grep -F '<div id="root">'
          curl -fsS http://127.0.0.1:15173/api/health | grep -F '"status":"up"'
      - name: Verify PostgreSQL shortlist survives backend replacement
        run: |
          jar=$(mktemp)
          trap 'rm -f "$jar"' EXIT
          api=http://127.0.0.1:15173/api
          curl -fsS -c "$jar" "$api/shortlist"
          curl -fsS -b "$jar" -X PUT "$api/shortlist/lost-cherry"
          docker compose up --force-recreate --no-deps --wait backend
          curl -fsS --retry 5 --retry-delay 1 -b "$jar" "$api/shortlist" | grep -F '"id":"lost-cherry"'
      - name: Capture failure logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-reports
          path: |
            scent-mood/e2e/playwright-report/
            scent-mood/e2e/test-results/
          if-no-files-found: warn
      - name: Stop application
        if: always()
        run: docker compose down -v

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-lint, backend-test, browser-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    concurrency:
      group: ghcr-${{ matrix.service }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve write-once commit tag
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE:sha-$GITHUB_SHA"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if result=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref" 2>&1); then
            [[ "$result" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "digest=$result" >> "$GITHUB_OUTPUT"
          elif ! grep -Eiq 'not found|manifest unknown|name unknown|insufficient_scope' <<< "$result"; then
            printf '%s\n' "$result" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        if: steps.image.outputs.digest == ''
        id: publish
        with:
          context: scent-mood
          file: scent-mood/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record published digest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.image.outputs.digest || steps.publish.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

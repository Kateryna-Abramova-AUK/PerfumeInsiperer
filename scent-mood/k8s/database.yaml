apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  clusterIP: None
  ports:
    - port: 5432
  selector:
    app: scent-mood-database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scent-mood-database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app: scent-mood-database
  template:
    metadata:
      labels:
        app: scent-mood-database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: scent-mood-db
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

name: scent-mood
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SCENT_MOOD_SHORTLIST_DIRECTORY: /app/data
      SCENT_MOOD_SECURE_COOKIE: ${SCENT_MOOD_SECURE_COOKIE:-false}
    volumes:
      - shortlist_data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 4s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 3s
      timeout: 4s
      retries: 20
volumes:
  shortlist_data:
